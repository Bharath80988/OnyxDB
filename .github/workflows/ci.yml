name: OnyxDB CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test OnyxDB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: onyxdb-dashboard/package-lock.json

      - name: Build Frontend & Maven Packages
        run: |
          mvn clean package -DskipTests

      - name: Run Backend Unit Tests
        run: |
          mvn test
